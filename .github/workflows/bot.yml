# TradeGuide Bot on GitHub Actions (free). Runs every 30 min on weekdays during US market hours
# and every 2 hours for crypto. Bot memory is committed back to data/bot-state.json
# (or set UPSTASH_REDIS_REST_* secrets to keep it out of the repo — recommended for public repos).
# Add your channel keys under: Repo → Settings → Secrets and variables → Actions.
name: TradeGuide Bot
on:
  schedule:
    - cron: '15,45 13-20 * * 1-5'   # ~9:15–16:45 ET (UTC; shifts 1h with daylight saving — harmless)
    - cron: '7 */2 * * *'           # crypto every 2 hours
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: tradeguide-bot, cancel-in-progress: false }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --omit=dev --no-audit --no-fund
      - run: node bot/run.mjs
        env:
          APP_URL: ${{ secrets.APP_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          SNAPTRADE_CLIENT_ID: ${{ secrets.SNAPTRADE_CLIENT_ID }}
          SNAPTRADE_CONSUMER_KEY: ${{ secrets.SNAPTRADE_CONSUMER_KEY }}
          SNAPTRADE_USER_ID: ${{ secrets.SNAPTRADE_USER_ID }}
          SNAPTRADE_USER_SECRET: ${{ secrets.SNAPTRADE_USER_SECRET }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          ALPACA_PAPER: ${{ secrets.ALPACA_PAPER }}
      - name: Save bot memory
        if: ${{ env.UPSTASH == '' }}
        env: { UPSTASH: '${{ secrets.UPSTASH_REDIS_REST_URL }}' }
        run: |
          git config user.name "tradeguide-bot"
          git config user.email "tradeguide-bot@users.noreply.github.com"
          git add data/bot-state.json || true
          git diff --cached --quiet || (git commit -m "bot: update state [skip ci]" && git push)
